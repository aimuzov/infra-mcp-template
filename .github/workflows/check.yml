name: Check

# На main эти проверки вызывает workflow релиза перед публикацией и деплоем, а ветки
# проверяются через PR. Отдельный прогон на push дал бы дубль на тот же коммит.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/check.yml
      - uses: aimuzov/infra-mcp-kit/check@v3
        # Образ собирается и на сервере, но лучше, чтобы он сломался здесь.
        with:
          docker: deploy/Dockerfile
          coverage-lines: 98
        if: steps.verified.outputs.reused != 'true'
      - name: Check production memory budgets
        if: steps.verified.outputs.reused != 'true'
        env:
          POLICY_REVISION: b7698e98bcb6b1ad274af612b4bf790b62ae424b
        run: |
          curl --fail --silent --show-error --retry 2             "https://raw.githubusercontent.com/aimuzov/infra-server/$POLICY_REVISION/deploy/check-memory-limits.py"             -o "$RUNNER_TEMP/check-memory-limits.py"
          docker compose -p ci-memory -f deploy/docker-compose.yml config --no-env-resolution --format json             | python3 "$RUNNER_TEMP/check-memory-limits.py"
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/check.yml
